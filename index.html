*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:var(--f);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(46px);z-index:-1;pointer-events:none}
.b1{width:300px;height:300px;background:rgba(184,145,63,.28);top:-70px;right:-70px}
.b2{width:360px;height:360px;background:rgba(142,21,32,.08);bottom:-120px;left:-120px}
.b3{width:200px;height:200px;background:rgba(184,145,63,.14);top:42%;right:-60px}
#app{max-width:1100px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 10px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{height:46px;width:auto;border-radius:8px}.bname{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;align-items:center;gap:6px;font:600 15px var(--f);color:var(--mut);background:var(--glass);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lang .on{color:var(--red);font-weight:800}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin:12px 0;box-shadow:0 8px 30px rgba(156,24,32,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
h1{font-size:34px;line-height:1.15;margin:8px 0 10px}h2{font-size:23px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2 small{font-size:14px;color:var(--mut);font-weight:400}

.small{font-size:14px;color:var(--mut);margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px var(--f);background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;text-decoration:none;min-height:50px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--red-d);border:1px solid rgba(211,34,46,.25)}

.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.wrapx{flex-wrap:wrap;justify-content:flex-start}
.fl{display:block;margin:14px 0;font-weight:600;font-size:15px}
input,select{display:block;width:100%;margin-top:6px;font:17px var(--f);color:var(--ink);background:rgba(255,255,255,.85);border:1.5px solid rgba(211,34,46,.2);border-radius:14px;padding:12px 14px;min-height:48px}
input:focus,select:focus{outline:2px solid var(--red);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}h2.sub{margin-top:22px}
.mini{display:flex;gap:14px;align-items:center;margin-bottom:6px}.lpb{width:96px;height:96px;border-radius:50%;border:12px solid var(--red);display:grid;place-items:center;margin:0 auto}.lpb b{font-size:38px;line-height:1}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.err{color:var(--red);font-size:15px;min-height:22px;margin:10px 0 0}
.prog{height:8px;background:rgba(211,34,46,.14);border-radius:8px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .3s}
.q{margin:16px 0;padding-bottom:14px;border-bottom:1px solid rgba(211,34,46,.1)}.q p{margin:0 0 10px;font-size:17px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dot{font:700 18px var(--f);height:50px;border-radius:14px;border:1.5px solid rgba(211,34,46,.25);background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer}
.dot.sel{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chip{text-align:left;font:15px var(--f);padding:12px;border-radius:16px;border:1.5px solid rgba(211,34,46,.22);background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.chip b{font-size:16px}.chip span{font-size:13.5px;color:var(--mut);font-weight:400}.chip.sel{border-color:var(--red);background:rgba(211,34,46,.1)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.seg button{font:600 15px var(--f);padding:11px 6px;border-radius:14px;border:1.5px solid rgba(211,34,46,.25);background:rgba(255,255,255,.8);cursor:pointer;color:var(--ink)}.seg .sel{background:var(--red);color:#fff;border-color:var(--red)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:400;margin:14px 0}.chk input{width:24px;height:24px;min-height:0;margin:2px 0 0;accent-color:var(--red);flex:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:13px;padding:10px 4px}.adm{color:var(--mut);text-decoration:none;display:inline-flex;gap:4px;align-items:center;opacity:.7}
.ic{flex:none;vertical-align:middle}
/* angel animation (CSS only, loops) */
.angel{display:inline-block}.angel.big{width:170px}.angel.mid{width:112px;flex:none}
.angel svg{width:100%;height:auto;display:block;overflow:visible;animation:float 3.4s ease-in-out infinite}
.wing{animation:flapL 2.6s ease-in-out infinite;transform-origin:29px 55px}.wing.wr{transform-origin:51px 55px;animation-name:flapR}
.eyes{transform-origin:40px 40px;animation:blink 4.2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){.angel svg,.wing,.eyes{animation:none}}
/* report */
.rwrap{display:block}.report{padding:20px}
.rh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rmeta{flex:1;min-width:150px}.rmeta small{color:var(--red);font-weight:600;font-size:14px}
.rname{font-size:30px;margin:2px 0 6px}.pill{display:inline-block;background:var(--red);color:#fff;font-weight:700;padding:5px 16px;border-radius:999px;font-size:16px}
.ringw{text-align:center;width:118px;flex:none}.ringw small{color:var(--mut);font-size:13px}.ring{width:118px;height:118px}.rb{fill:none;stroke:rgba(211,34,46,.16);stroke-width:13}.rf{fill:none;stroke:var(--red);stroke-width:13;stroke-linecap:round}.rn{font:700 38px var(--f);fill:var(--ink)}
.report h3{font-size:20px;margin:20px 0 8px;display:flex;align-items:center;gap:10px}.report h3 i{width:5px;height:20px;background:var(--red);border-radius:3px}
.dots{margin:0;padding:0;list-style:none}.dots li{position:relative;padding:4px 0 4px 22px;font-size:16.5px}.dots li:before{content:"";position:absolute;left:2px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--red)}.dots.gold li:before{background:var(--gold)}
.style{font-style:italic;color:var(--mut);font-size:14.5px;margin:10px 0 0}.tl{font-style:italic;color:var(--red-d);margin:0 0 8px;font-size:15.5px}
.tips{display:grid;gap:8px}.tip{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.6);border:1px solid rgba(211,34,46,.12);border-radius:16px;padding:12px}.tip p{margin:0;font-size:15.5px}.tip b{color:var(--red-d)}
.tb{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.fun{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.fc{background:rgba(255,255,255,.6);border:1px solid rgba(211,34,46,.12);border-radius:16px;padding:12px}.fc small{color:var(--mut);font-size:12px;letter-spacing:.06em}.fc b{display:block;color:var(--red);font-size:18px}.fc p{margin:2px 0 0;font-size:14.5px}
.cta{background:var(--red);color:#fff;border-radius:18px;padding:16px;margin-top:16px}.cta p{margin:0 0 12px;font-weight:700;font-size:16.5px}
.sig{text-align:center;font-weight:700;margin:16px 0 4px}.disc{text-align:center;color:var(--mut);font-size:12px;margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1;min-width:110px;padding:12px 14px}
.ok{color:#1a7f37;font-weight:700;display:flex;gap:8px;align-items:center}.narrow{max-width:420px;margin:30px auto}.pin{text-align:center;font-size:30px;letter-spacing:.4em;margin:12px 0}
.list{margin-top:14px;display:grid;gap:8px}.lr{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.7);border-radius:16px;padding:12px;border:1px solid rgba(211,34,46,.12)}.lr small{color:var(--mut)}.tag{background:rgba(211,34,46,.1);color:var(--red-d);border-radius:8px;padding:1px 8px;font-size:12px}
.gr{display:flex;gap:6px;align-items:flex-start}.gr button{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(211,34,46,.25);background:#fff;font:700 16px var(--f);cursor:pointer}.gr .sel{background:var(--red);color:#fff;border-color:var(--red)}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.show{opacity:1;transform:translate(-50%,0)}

.cta{margin:14px 10px 0;background:var(--red-d);border-radius:0;outline:1.5px solid var(--gold-l);outline-offset:-7px;padding:24px 20px;text-align:center;color:#FFF6DD}

.sig{font-style:italic;font-weight:700;margin:18px 0 4px}.sig:before{content:"◆  ";color:var(--gold)}.sig:after{content:"  ◆";color:var(--gold)}
.disc{padding:0 14px 12px}.tb.yr{font-size:11.5px;letter-spacing:0}

/* ===== birthday engine (pure functions, offline, no AI) ===== */
function lifePath(d,m,y){ // birthday number 1-9: add every digit of the full birth date, repeat until one digit
  let n=[...(''+d+m+y)].reduce((a,c)=>a+(+c),0);
  while(n>9) n=[...(''+n)].reduce((a,c)=>a+(+c),0);
  return n;
}
function zodiacOf(m,d){
  if((m===12&&d>=22)||(m===1&&d<20)) return ZODIAC[0];
  let pick=ZODIAC[0];
  for(const z of ZODIAC){ if(m>z[2]||(m===z[2]&&d>=z[3])) pick=z; }
  return pick;
}
function analyze(s){
  const z=zodiacOf(+s.m,+s.d);
  return {name:s.name.trim(),lp:lifePath(+s.d,+s.m,+s.y),z,disc:s.disc,mbti:s.mbti,key:(+s.m)+'-'+(+s.d)};
}

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,maxW){
  const toks=text.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g)||[]; const lines=[]; let cur='';
  for(const t of toks){ const test=cur+t; if(/^[，。、；：！？）」』,.;:!?)]$/.test(t)){ cur=test; continue; } if(c.measureText(test).width>maxW&&cur.trim()){ lines.push(cur.trim()); cur=t.trim()?t:''; } else cur=test; }
  if(cur.trim()) lines.push(cur.trim()); return lines;
}
function laurel(c,cx,cy,R,col){ // two laurel branches around a circle (flat colour)
  c.fillStyle=col;
  for(const side of [1,-1]) for(let k=0;k<9;k++){
    const t=Math.PI*(0.6+k*0.1), px=cx+side*(R+9)*Math.cos(t), py=cy+(R+9)*Math.sin(t);
    c.save(); c.translate(px,py); c.rotate(side===1?t+Math.PI/2+.45:Math.PI-(t+Math.PI/2)-.45); c.beginPath(); c.ellipse(0,0,13,5.5,0,0,7); c.fill(); c.restore();
  }
}

    // medallion + angel

    if(imgs.logo){ const lh=50,lw=imgs.logo.width/imgs.logo.height*lh; c.fillStyle='#fff'; c.fillRect(tx-3,by+23,lw+6,lh+6); c.drawImage(imgs.logo,tx,by+26,lw,lh); }
    c.save(); if('letterSpacing' in c) c.letterSpacing='3px'; txt(r.t.app.toUpperCase(),tx,by+104,`600 19px ${FONT}`,C.goldL); c.restore();
    c.font=`bold 58px ${FONT}`; let nm=r.name; while(c.measureText(nm).width>400&&nm.length>2) nm=nm.slice(0,-1); if(nm!==r.name) nm+='…';
    txt(nm,tx,by+165,`bold 58px ${FONT}`,'#FFF6DD');

    // seal with laurel

    <div class="fl">${t('是否想了解 PRUVenture？','Want to learn about PRUVenture?')}<div class="seg">${[['yes',t('想了解','Yes')],['maybe',t('再看看','Maybe')],['no',t('暂不需要','Not now')]].map(o=>`<button type="button" class="${L.pv===o[0]?'sel':''}" data-pv="${o[0]}">${o[1]}</button>`).join('')}</div></div>
    <label class="chk"><input type="checkbox" data-l="consent" ${L.consent?'checked':''}><span>${t('我同意 Jeff Lee / 101 GROUP 依据马来西亚个人资料保护法令（PDPA 2010）收集并使用我提供的资料，用于联系我了解保险事业机会。我可随时要求删除。','I consent to Jeff Lee / 101 GROUP collecting and using the details I provide under Malaysia\'s PDPA 2010 to contact me about career opportunities. I may ask for deletion at any time.')}</span></label>
    <button type="button" class="btn" id="lsub" ${L.consent?'':'disabled'} data-act="lead">${t('提交','Submit')}</button><p class="err" id="lerr"></p>`}
   </form></aside></div>`);
  
}
function animateRing(){
  const f=document.querySelector('.rf'); if(!f) return; const fit=+f.dataset.fit,c=+f.dataset.c,n=$('#rn'); const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/1100), e=1-Math.pow(1-k,3); f.setAttribute('stroke-dashoffset',c*(1-fit/100*e)); n.textContent=Math.round(fit*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function vSales(){
  const a=S.report, r=buildSales(a,lang);
  setHTML(`<div class="swrap"><article class="glass report sales" id="sales"><p class="warn">${ico('lock',16)} ${r.t.warn}</p>
   <div class="rh"><div class="med">${angelHTML('mid')}</div><div class="rmeta"><small>${r.t.title}</small><h2 class="rname">${esc(r.name)}</h2><span class="pill">${esc(r.tag)}${r.badges.length?' · '+esc(r.badges.join(' · ')):''}</span></div><div class="ringw">${sealSVG(r.lp)}<small>${lang==='zh'?'生日数字':'Birthday Number'}</small></div></div>
   ${r.sections.map(s=>`<section class="pn ${s.warn?'wn':''}"><h3>${s.h}</h3><ul class="dots ${s.warn?'gold':''}">${s.items.map(i=>`<li>${s.quote?'<q>'+esc(i)+'</q>':esc(i)}</li>`).join('')}</ul></section>`).join('')}
   <p class="disc">${r.t.note}</p></article>
   <aside><div class="glass acts"><button class="btn" data-act="copy">${ico('dl',18)} ${t('复制笔记','Copy notes')}</button><button class="btn red2" data-act="torecruit">${t('转成招募版（给对方看）','Switch to Recruit view')}</button><button class="btn ghost" data-act="redo">${t('下一位客户','Next client')}</button></div></aside></div>`);
}
/* ---- admin ---- */
async function vAdmin(){
  const pin=await kvGet('pin');
  if(!S.adminOK){
    setHTML(`<section class="glass narrow"><h2>${ico('lock',22)} Admin</h2><p class="small">${pin?t('请输入 4 位 PIN','Enter your 4-digit PIN'):t('首次使用：设定 4 位 PIN','First time: set a 4-digit PIN')}</p>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="off"><button class="btn" data-act="pin">${t('确认','Confirm')}</button><p class="err" id="err"></p><a class="small" href="#/" data-act="home">← ${t('返回','Back')}</a></section>`);
    return;
  }
  const rows=(await leadAll()).sort((a,b)=>b.id-a.id), booth=!!(await kvGet('booth'));
  setHTML(`<section class="glass"><h2>Admin <small>${rows.length} ${t('位','leads')}</small></h2>
   <label class="chk"><input type="checkbox" id="booth" ${booth?'checked':''}><span>${t('摊位模式（iPad 专用）：提交后只保存在本机；关闭时，提交后会多一个「用 WhatsApp 发给 Jeff」按钮。','Booth mode (iPad): leads are only saved on this device. When off, a "Send to Jeff on WhatsApp" button appears after submitting.')}</span></label>
   <div class="actions wrapx"><button class="btn" data-act="csv">${ico('dl',18)} CSV</button><button class="btn ghost" data-act="chpin">${t('改 PIN','Change PIN')}</button><button class="btn ghost danger" data-act="wipe">${t('清空全部','Delete all')}</button><a class="btn ghost" href="#/" data-act="home">${t('返回','Back')}</a></div>
   <div class="list">${rows.length?rows.map(r=>`<div class="lr"><div><b>${esc(r.name)}</b> <span class="tag">LP ${r.lp||''} ${esc(r.zodiac||'')}</span><br><small>${esc(r.wa)} · ${esc(r.school)} · ${esc(r.grad)} · PRUVenture: ${esc(r.pv)}</small><br><small>DISC ${esc(r.disc||'-')} · MBTI ${esc(r.mbti||'-')} · ${new Date(r.ts).toLocaleString()}</small></div><div class="gr">${['A','B','C'].map(g=>`<button class="${r.grade===g?'sel':''}" data-grade="${g}" data-id="${r.id}">${g}</button>`).join('')}</div></div>`).join(''):`<p class="small">${t('还没有名单','No leads yet')}</p>`}</div></section>`);
}
/* ---- actions ---- */
const flash=(id,m)=>{const e=$('#'+id); if(e) e.textContent=m;};
function validate1(){
  if(!S.name.trim()) return t('请输入名字','Please enter your name');
  if(!S.d||!S.m||!S.y) return t('请选择完整生日','Please choose your full birthday');
  const dt=new Date(+S.y,+S.m-1,+S.d); if(dt.getMonth()!==+S.m-1) return t('这个日期不存在，请检查','That date does not exist');
  return '';
}
function route(){
  if(location.hash==='#/admin') return vAdmin();
  S.adminOK=false;
  ({0:vWelcome,1:vProfile,4:vReport,5:vSales})[S.step]();
  window.scrollTo(0,0);
}
async function exportBlob(kind){
  const r=buildReport(S.report,lang), fn=`MillionAngel-${S.report.name.replace(/[^\w一-鿿-]+/g,'_')}`;
  const b=kind==='pdf'?await makePDF(r):await makePNG(r); return {b,name:fn+(kind==='pdf'?'.pdf':'.png')};
}
function saveBlob(b,name){ const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
function toast(m){ let e=$('#toast'); if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e);} e.textContent=m; e.className='show'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.className='',2200); }
async function csvExport(){
  const rows=(await leadAll()).sort((a,b)=>a.id-b.id);
  const H=['time','name','whatsapp','school_major','grad_year','pruventure','grade','zodiac','disc','mbti','life_path','pdpa_consent'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[H.join(',')].concat(rows.map(r=>[new Date(r.ts).toISOString(),r.name,r.wa,r.school,r.grad,r.pv,r.grade||'',r.zodiac,r.disc,r.mbti,r.lp,r.consent?'yes':'no'].map(q).join(',')));
  saveBlob(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}),`leads-${new Date().toISOString().slice(0,10)}.csv`);
}
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-act],[data-v],[data-disc],[data-pv],[data-grade]'); if(!g) return;
  if(g.dataset.disc){ S.disc=S.disc===g.dataset.disc?'':g.dataset.disc; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.disc===S.disc)); return; }
  if(g.dataset.pv){ S.lead.pv=g.dataset.pv; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('sel',b.dataset.pv===S.lead.pv)); return; }
  if(g.dataset.grade){ const rows=await leadAll(); const r=rows.find(x=>x.id==g.dataset.id); r.grade=r.grade===g.dataset.grade?'':g.dataset.grade; await leadPut(r); return vAdmin(); }
  const a=g.dataset.act;
  if(a==='lang'){ lang=lang==='zh'?'en':'zh'; ls.set('td_lang',lang); document.documentElement.lang=lang; return route(); }
  if(a==='start'){ S.step=1; return route(); }
  if(a==='back'){ S.step=0; return route(); }
  if(a==='m-recruit'||a==='m-sales'){ S.mode=a==='m-sales'?'sales':'recruit'; S.step=1; return route(); }
  if(a==='go'){ const m=validate1(); if(m) return flash('err',m); S.report=analyze(S); S.step=S.mode==='sales'?5:4; S.leadDone=false; return route(); }
  if(a==='torecruit'){ S.mode='recruit'; S.step=4; return route(); }
  if(a==='copy'){ const txt=salesText(buildSales(S.report,lang)); try{ await navigator.clipboard.writeText(txt); toast(t('已复制','Copied')); }catch(err){ toast(t('无法复制，请长按选取','Copy failed')); } return; }
  if(a==='redo'){ Object.assign(S,{step:1,name:'',d:'',m:'',y:'',disc:'',mbti:'',report:null,leadDone:false,lead:{name:'',wa:'',school:'',grad:'',pv:'yes',consent:false}}); return route(); }
  if(a==='png'||a==='pdf'){ toast(t('生成中…','Rendering…')); const x=await exportBlob(a); saveBlob(x.b,x.name); return; }
  if(a==='share'){ toast(t('生成中…','Rendering…')); const x=await exportBlob('png'); const f=new File([x.b],x.name,{type:'image/png'});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:t('我的天赋报告','My Talent Report'),text:t('我的百万天使天赋报告','My Million Angel Talent Report')}); else saveBlob(x.b,x.name); }catch(err){ if(err&&err.name!=='AbortError') saveBlob(x.b,x.name); } return; }
  if(a==='lead'){ e.preventDefault(); const L=S.lead;
    if(!L.consent) return flash('lerr',t('请先勾选同意','Please tick the consent box'));
    if(!L.name.trim()) return flash('lerr',t('请输入名字','Please enter your name'));
    if(L.wa.replace(/\D/g,'').length<9) return flash('lerr',t('请输入有效的 WhatsApp 号码','Please enter a valid WhatsApp number'));
    const A=S.report; await leadAdd({ts:Date.now(),name:L.name.trim(),wa:L.wa.trim(),school:L.school.trim(),grad:L.grad.trim(),pv:L.pv,zodiac:A.z[1],disc:A.disc,mbti:A.mbti,lp:A.lp,consent:true,grade:''});
    const booth=!!(await kvGet('booth')); S.leadDone=true;
    S.leadWA=booth?'':'https://wa.me/60197787031?text='+encodeURIComponent(`Hi Jeff, I'm ${L.name.trim()} (${L.school.trim()}, ${L.grad.trim()}). Birthday Decoder (Number ${A.lp}, ${A.z[1]}). PRUVenture: ${L.pv}. WhatsApp: ${L.wa.trim()}. I agree to be contacted (PDPA).`);
    return vReport(); }
  if(a==='admin'||a==='home'){ /* hashchange handles */ if(a==='home'){ S.adminOK=false; } return; }
  if(a==='pin'){ e.preventDefault(); const v=($('#pin').value||'').trim(); if(!/^\d{4}$/.test(v)) return flash('err',t('请输入 4 位数字','Enter 4 digits')); const cur=await kvGet('pin');
    if(!cur){ await kvSet('pin',hashPin(v)); S.adminOK=true; return vAdmin(); } if(cur===hashPin(v)){ S.adminOK=true; return vAdmin(); } return flash('err',t('PIN 不对','Wrong PIN')); }
  if(a==='csv') return csvExport();
  if(a==='chpin'){ const v=prompt(t('输入新的 4 位 PIN','New 4-digit PIN')); if(v&&/^\d{4}$/.test(v)){ await kvSet('pin',hashPin(v)); toast(t('已更新','Updated')); } return; }
  if(a==='wipe'){ if(confirm(t('确定清空全部名单？此操作无法还原。','Delete ALL leads? This cannot be undone.'))&&confirm(t('再确认一次：真的要全部删除吗？','Really delete everything?'))){ await leadClear(); return vAdmin(); } return; }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset;
  if(f.f){ S[f.f]=e.target.value; }
  if(f.l){ if(f.l==='consent'){ S.lead.consent=e.target.checked; const b=$('#lsub'); if(b) b.disabled=!S.lead.consent; } else S.lead[f.l]=e.target.value; }
  if(e.target.id==='booth') kvSet('booth',e.target.checked);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pin'){ e.preventDefault(); document.querySelector('[data-act=pin]').click(); } if(e.key==='Enter'&&e.target.closest&&e.target.closest('#lead')) e.preventDefault(); });
window.addEventListener('hashchange',route);
document.documentElement.lang=lang; route();
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had&&!reloaded&&S.step<2&&location.hash!=='#/admin'){ reloaded=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
